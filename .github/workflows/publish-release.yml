name: Publish verified Tvim 1.9.6 APK

on:
  push:
    branches: [master]
    paths:
      - downloads/Tvim-1.9.6.apk
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-1.9.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK checksum
        working-directory: downloads
        run: sha256sum --check SHA256-1.9.6.txt
      - name: Publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.6 >/dev/null 2>&1; then
            echo "Release v1.9.6 already exists; preserving published assets."
          else
            gh release create v1.9.6 downloads/Tvim-1.9.6.apk downloads/SHA256-1.9.6.txt --target "$GITHUB_SHA" --title "Tvim 1.9.6 — Color Choices" --notes-file RELEASE-1.9.6.md --latest
          fi
